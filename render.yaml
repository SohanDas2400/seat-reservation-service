# Render Blueprint: deploys the containerized service on the free tier.
# The MySQL database is provisioned separately (Aiven free MySQL) and its connection
# details are supplied via the environment variables below (set in the Render dashboard).
services:
  - type: web
    name: seat-reserve
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false          # jdbc:mysql://<aiven-host>:<port>/seatreserve?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true  # Render generates a strong secret
